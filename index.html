<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chúc Mừng Ngày Phụ Nữ Việt Nam</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #ffe6f0, #fff0f5);
      font-family: 'Playfair Display', serif;
      overflow: hidden;
    }
    .envelope {
      width: 340px;
      height: 240px;
      background: #fff;
      border: 3px solid #ff99cc;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.6s ease-in-out, box-shadow 0.6s ease-in-out;
      z-index: 10;
    }
    .envelope:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 105, 180, 0.5);
    }
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to bottom, #ff80b3, #ff4d94);
      clip-path: polygon(50% 50%, 0 0, 100% 0);
      transition: transform 0.8s ease-in-out;
      transform-origin: top;
    }
    .envelope.open::before {
      transform: translateY(-100%) rotateX(180deg);
    }
    .letter {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      background: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
      font-size: 22px;
      color: #c2185b;
      border: 2px solid #ff99cc;
      border-radius: 8px;
      transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
      opacity: 0;
      transform: translateY(50px);
      z-index: 15;
    }
    .envelope.open .letter {
      display: flex;
      transform: translateY(0);
      opacity: 1;
      animation: sparkle 3s infinite ease-in-out;
    }
    .envelope .letter.hidden {
      transform: translateY(50px);
      opacity: 0;
    }
    @keyframes sparkle {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 105, 180, 0.4); }
      50% { box-shadow: 0 0 25px rgba(255, 105, 180, 0.8); }
    }
    .letter p {
      animation: fadeInText 1s ease-in-out forwards;
    }
    @keyframes fadeInText {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="petals"></canvas>
  <div class="envelope" id="envelope">
    <div class="letter hidden" id="letter">
      <p>CHÚC MỪNG NGÀY PHỤ NỮ VIỆT NAM!<br>
      Chúc bà luôn rực rỡ, hạnh phúc và học giỏi, gặp nhiều may mắn!🙆‍♂️🌺✨</p>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const letter = document.getElementById('letter');
    
    envelope.addEventListener('click', () => {
      envelope.classList.toggle('open');
      letter.classList.toggle('hidden');
    });

    // Canvas setup
    const canvas = document.getElementById('petals');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const petals = [];
    const petalCount = 15; // Giảm số lượng cánh hoa
    const stars = [];
    const starCount = 10; // Giảm số lượng ngôi sao
    const hearts = [];
    const heartCount = 12; // Số lượng trái tim

    class Petal {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height * 0.3;
        this.size = Math.random() * 10 + 5;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 1 + 0.5;
        this.opacity = 1;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = Math.random() * 0.05 - 0.025;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.angle += this.spin;
        this.opacity = this.y < canvas.height * 0.9 ? 1 : 1 - (this.y - canvas.height * 0.9) / (canvas.height * 0.1);
        if (this.y > canvas.height || this.x < -this.size || this.x > canvas.width + this.size || this.opacity <= 0) {
          this.x = Math.random() * canvas.width;
          this.y = -this.size;
          this.opacity = 1;
          this.angle = Math.random() * Math.PI * 2;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = `rgba(255, ${Math.random() * 50 + 150}, ${Math.random() * 50 + 150}, ${this.opacity})`;
        ctx.beginPath();
        ctx.moveTo(0, -this.size);
        ctx.quadraticCurveTo(this.size * 0.4, 0, 0, this.size);
        ctx.quadraticCurveTo(-this.size * 0.4, 0, 0, -this.size);
        ctx.fill();
        ctx.restore();
      }
    }

    class Star {
      constructor() {
        const envelopeRect = envelope.getBoundingClientRect();
        this.x = envelopeRect.left + Math.random() * envelopeRect.width;
        this.y = envelopeRect.top + Math.random() * envelopeRect.height;
        this.size = Math.random() * 5 + 3;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
        this.opacity = Math.random() * 0.5 + 0.5;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = Math.random() * 0.05 - 0.025;
      }
      update() {
        if (!envelope.classList.contains('open')) return;
        this.x += this.speedX;
        this.y += this.speedY;
        this.angle += this.spin;
        this.opacity -= 0.01;
        if (this.opacity <= 0 || Math.abs(this.x - (canvas.width / 2)) > 200 || Math.abs(this.y - (canvas.height / 2)) > 200) {
          const envelopeRect = envelope.getBoundingClientRect();
          this.x = envelopeRect.left + Math.random() * envelopeRect.width;
          this.y = envelopeRect.top + Math.random() * envelopeRect.height;
          this.opacity = Math.random() * 0.5 + 0.5;
          this.size = Math.random() * 5 + 3;
          this.angle = Math.random() * Math.PI * 2;
        }
      }
      draw() {
        if (!envelope.classList.contains('open')) return;
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = `rgba(255, 255, ${Math.random() * 50 + 200}, ${this.opacity})`;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * this.size, Math.sin((18 + i * 72) * Math.PI / 180) * this.size);
          ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size / 2), Math.sin((54 + i * 72) * Math.PI / 180) * (this.size / 2));
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    class Heart {
      constructor() {
        const envelopeRect = envelope.getBoundingClientRect();
        this.x = envelopeRect.left + Math.random() * envelopeRect.width;
        this.y = envelopeRect.top + Math.random() * envelopeRect.height;
        this.size = Math.random() * 6 + 4;
        this.speedX = Math.random() * 0.8 - 0.4;
        this.speedY = Math.random() * 0.8 - 0.4;
        this.opacity = Math.random() * 0.5 + 0.5;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = Math.random() * 0.03 - 0.015;
      }
      update() {
        if (!envelope.classList.contains('open')) return;
        this.x += this.speedX;
        this.y += this.speedY;
        this.angle += this.spin;
        this.opacity -= 0.008;
        if (this.opacity <= 0 || Math.abs(this.x - (canvas.width / 2)) > 200 || Math.abs(this.y - (canvas.height / 2)) > 200) {
          const envelopeRect = envelope.getBoundingClientRect();
          this.x = envelopeRect.left + Math.random() * envelopeRect.width;
          this.y = envelopeRect.top + Math.random() * envelopeRect.height;
          this.opacity = Math.random() * 0.5 + 0.5;
          this.size = Math.random() * 6 + 4;
          this.angle = Math.random() * Math.PI * 2;
        }
      }
      draw() {
        if (!envelope.classList.contains('open')) return;
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = `rgba(255, ${Math.random() * 50 + 100}, ${Math.random() * 50 + 100}, ${this.opacity})`;
        ctx.beginPath();
        ctx.moveTo(0, this.size / 2);
        ctx.bezierCurveTo(this.size * 0.75, this.size * 0.1, this.size, -this.size / 2, 0, -this.size);
        ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size * 0.75, this.size * 0.1, 0, this.size / 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < petalCount; i++) {
      petals.push(new Petal());
    }
    for (let i = 0; i < starCount; i++) {
      stars.push(new Star());
    }
    for (let i = 0; i < heartCount; i++) {
      hearts.push(new Heart());
    }

    function animatePetals() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      petals.forEach(petal => {
        petal.update();
        petal.draw();
      });
      stars.forEach(star => {
        star.update();
        star.draw();
      });
      hearts.forEach(heart => {
        heart.update();
        heart.draw();
      });
      requestAnimationFrame(animatePetals);
    }

    animatePetals();
  </script>
</body>
</html>
