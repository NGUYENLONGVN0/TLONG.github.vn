<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư Chúc Mừng 20/10</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #ff99cc, #ffe6f0);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    .envelope {
      width: 320px;
      height: 220px;
      background: #fff;
      border: 3px solid #ff66a3;
      position: relative;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      z-index: 10;
    }
    .envelope:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to bottom, #ff4d94, #ff80b3);
      clip-path: polygon(50% 50%, 0 0, 100% 0);
      transition: transform 0.6s ease;
    }
    .envelope.open::before {
      transform: translateY(-100%) rotateX(180deg);
    }
    .letter {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      font-size: 20px;
      color: #d81b60;
      border: 2px solid #ff80b3;
      border-radius: 10px;
      transition: transform 0.6s ease, opacity 0.6s ease;
      font-family: 'Georgia', serif;
    }
    .envelope.open .letter {
      display: flex;
      transform: translateY(0);
      opacity: 1;
      animation: sparkle 2s infinite;
    }
    .envelope .letter.hidden {
      transform: translateY(100%);
      opacity: 0;
    }
    @keyframes sparkle {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 105, 180, 0.5); }
      50% { box-shadow: 0 0 20px rgba(255, 105, 180, 1); }
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="petals"></canvas>
  <div class="envelope" id="envelope">
    <div class="letter hidden" id="letter">
      <p>Chúc mừng ngày 20/10!<br>
      Chúc bạn luôn rực rỡ, hạnh phúc và tỏa sáng như những đóa hoa đẹp nhất! 🌺✨</p>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const letter = document.getElementById('letter');
    
    envelope.addEventListener('click', () => {
      envelope.classList.toggle('open');
      letter.classList.toggle('hidden');
    });

    // Flower petals animation
    const canvas = document.getElementById('petals');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const petals = [];
    const petalCount = 20;

    class Petal {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height * 0.5;
        this.size = Math.random() * 15 + 5;
        this.speedX = Math.random() * 2 - 1;
        this.speedY = Math.random() * 2 + 1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y > canvas.height || this.x < 0 || this.x > canvas.width) {
          this.x = Math.random() * canvas.width;
          this.y = -this.size;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(255, ${Math.random() * 100 + 100}, ${Math.random() * 100 + 100}, 0.7)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < petalCount; i++) {
      petals.push(new Petal());
    }

    function animatePetals() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      petals.forEach(petal => {
        petal.update();
        petal.draw();
      });
      requestAnimationFrame(animatePetals);
    }

    animatePetals();
  </script>
</body>
</html>
